<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雷姆全网情报站 // AI & Tech Intelligence Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --bg-base: #06070c;
            --bg-card: rgba(18, 22, 38, 0.75);
            --bg-card-hover: rgba(26, 31, 54, 0.9);
            --border-color: rgba(0, 243, 255, 0.2);
            --border-hover: rgba(255, 0, 127, 0.5);

            --text-main: #f1f5f9;
            --text-muted: #94a3b8;

            --neon-cyan: #00f3ff;
            --neon-pink: #ff007f;
            --neon-yellow: #ffe600;
            --shadow-glow: 0 0 25px rgba(0, 243, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(255, 0, 127, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
                linear-gradient(180deg, rgba(6, 7, 12, 0.95) 0%, rgba(6, 7, 12, 0.98) 100%),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 243, 255, 0.02) 3px, transparent 3px);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            line-height: 1.7;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container { max-width: 920px; width: 100%; }

        header {
            text-align: center;
            margin-bottom: 45px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .brand-subtitle {
            color: var(--text-muted);
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .report-list {
            display: grid;
            gap: 24px;
        }

        .report-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 28px;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-glow);
        }

        .report-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.15);
        }

        .report-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .report-title a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.2s;
        }

        .report-title a:hover {
            color: var(--neon-cyan);
        }

        .report-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 14px;
            display: flex;
            gap: 18px;
        }

        .report-desc {
            color: var(--text-main);
            font-size: 15px;
            margin-bottom: 18px;
        }

        .tag {
            display: inline-block;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            background: rgba(0, 243, 255, 0.1);
            color: var(--neon-cyan);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 3px 12px;
            border-radius: 20px;
        }

        footer {
            margin-top: 60px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 25px;
            font-family: 'Rajdhani', sans-serif;
        }
    </style>
</head>
